name: PPE notifications OVB-1

on:
  schedule:
    # Explicit UTC: 08:17–18:17 Asia/Yekaterinburg (UTC+5), hourly recovery.
    # Firestore's daily marker suppresses delivery after a successful attempt.
    - cron: '17 3-13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Безопасный режим проверки или адресной отправки'
        required: true
        default: validate
        type: choice
        options:
          - preview
          - validate
          - test
          - scheduled
      employee:
        description: 'Сотрудник для validate/test'
        required: false
        default: emp-006
        type: string
      date:
        description: 'Дата для preview/validate/test; scheduled использует только сегодня'
        required: false
        type: string

concurrency:
  group: ppe-notifications-ovb1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      PPE_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      PPE_EMPLOYEE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'scheduled' && inputs.employee || '' }}
      PPE_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || '' }}
    steps:
      - name: Checkout public automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/ppe/package-lock.json

      - name: Check Firebase secret
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured" >&2
            exit 1
          fi

      - name: Install notification runtime
        run: npm ci --prefix automation/ppe --ignore-scripts --no-audit --no-fund

      - name: Run PPE notification job
        run: node automation/ppe/ppeNotificationsCli.js
