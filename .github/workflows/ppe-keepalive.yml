name: Keep PPE schedule active

on:
  schedule:
    # 07:31 Asia/Yekaterinburg; a second day allows recovery from a missed run.
    - cron: '31 2 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record monthly heartbeat
        shell: bash
        run: |
          mkdir -p automation/ppe
          date -u +'%Y-%m-%dT%H:%M:%SZ' > automation/ppe/last-keepalive.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/ppe/last-keepalive.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Keep PPE notification schedule active'
          git push
