name: Keep PPE schedule active

on:
  schedule:
    - cron: '31 7 1 * *'
      timezone: 'Asia/Yekaterinburg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6

      - name: Record monthly heartbeat
        shell: bash
        run: |
          mkdir -p automation/ppe
          date -u +'%Y-%m-%dT%H:%M:%SZ' > automation/ppe/last-keepalive.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation/ppe/last-keepalive.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Keep PPE notification schedule active'
          git push
