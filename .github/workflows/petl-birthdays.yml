name: PETL birthday reminders

on:
  schedule:
    # 09:00 Asia/Yekaterinburg; 09:30 retries only failed recipients.
    - cron: '0,30 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview только проверяет; scheduled отправляет сегодняшние напоминания ПЭТЛ'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - scheduled

concurrency:
  group: petl-birthdays
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      BIRTHDAY_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
    steps:
      - name: Checkout public automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/ppe/package-lock.json
      - name: Install notification runtime
        run: npm ci --prefix automation/ppe --ignore-scripts --no-audit --no-fund
      - name: Check Firebase secret
        shell: bash
        run: test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
      - name: Run PETL birthday reminders
        run: node automation/ppe/petlBirthdayCli.js
